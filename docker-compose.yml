name: vacation-manager

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: vacation
      POSTGRES_DB: vacation_manager
    ports:
      - '${DB_PORT:-5440}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vacation -d vacation_manager']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://vacation:vacation@db:5432/vacation_manager
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-please-0123456789}
      FRONT_END_URL: http://localhost:${WEB_PORT:-8080}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3000}/api/v1
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
