services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: vacation
      POSTGRES_DB: vacation_manager
    ports:
      - '${DB_PORT:-5440}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vacation -d vacation_manager']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
